[project]
name = "agent-sdk-lab"
version = "1.0.0"
description = "Lab 3 of the AI Engineering series: one triage agent built four ways (hand-written loop, LangGraph, OpenAI Agents SDK, Claude Agent SDK), compared on the same eval."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["anthropic==2.9.0", "pydantic>=2.7", "langgraph==1.2.22", "openai-agents==0.24.0", "claude-agent-sdk==0.2.183"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
